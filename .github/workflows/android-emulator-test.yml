name: Android emulator installation and launch test
on:
  workflow_dispatch:
  push:
    branches: [dev/2.5.0-foundation]
    paths:
      - '.github/workflows/android-emulator-test.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug --no-daemon
      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n ir.mansour.jamealtafasir/.MainActivity
            sleep 8
            adb shell pidof ir.mansour.jamealtafasir
            adb logcat -d -s AndroidRuntime:E > /tmp/crashes.txt
            if grep -q 'FATAL EXCEPTION' /tmp/crashes.txt; then cat /tmp/crashes.txt; exit 1; fi
