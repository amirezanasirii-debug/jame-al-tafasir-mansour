name: Android installation regression
on:
  push:
    branches: [research/2.9-refresh]
    paths: [.github/workflows/research-android-install.yml, scripts/android-install-regression.sh]
permissions:
  contents: read
  actions: read
jobs:
  diagnose_previous:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Recover prior emulator diagnostics
        run: |
          gh api repos/amirezanasirii-debug/jame-al-tafasir-mansour/actions/jobs/124522727260/logs > previous.log
          python3 -c 'from pathlib import Path; t=Path("previous.log").read_text(); print("::warning title=Previous emulator log::"+t[-9000:].replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
  install:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 30, 36]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: amirezanasirii-debug/jame-al-tafasir-mansour
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare Android emulator
        timeout-minutes: 8
        env:
          API: ${{ matrix.api }}
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' "system-images;android-$API;google_apis;x86_64"
          echo no | avdmanager create avd --name mansour-install --package "system-images;android-$API;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$ANDROID_HOME/emulator/emulator" -avd mansour-install -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 3072 -partition-size 4096 > emulator.log 2>&1 &
          if ! timeout 90 adb wait-for-device; then cat emulator.log; exit 1; fi
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 3; done'
          adb shell input keyevent 82
      - name: Test clean installation and upgrade from previous release
        run: bash scripts/android-install-regression.sh
      - name: Diagnostics
        if: always()
        run: |
          tail -40 emulator.log || true
          python3 -c 'from pathlib import Path; p=Path("emulator.log"); print("::warning title=Emulator log::"+p.read_text()[-7000:].replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' || true
          timeout 15 adb logcat -d -s PackageManager PackageInstaller AndroidRuntime installd || true
