name: Signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.25.0"
  PYTHON_VERSION: "3.13"

jobs:
  android-release:
    name: Signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test, audit and build shared offline assets
        run: |
          pnpm test
          pnpm run test:security
          pnpm run audit
          pnpm run build

      - name: Decode Android signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing GitHub Secret: KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing GitHub Secret: KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing GitHub Secret: KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing GitHub Secret: KEY_PASSWORD}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jame-release.jks"
          chmod 600 "$RUNNER_TEMP/jame-release.jks"
          echo "JAME_KEYSTORE_PATH=$RUNNER_TEMP/jame-release.jks" >> "$GITHUB_ENV"
          echo "JAME_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "JAME_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "JAME_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build, sign and verify Android release APKs
        shell: bash
        run: |
          chmod +x gradlew
          python scripts/build-android.py --flavor all --build-type release --skip-web
          cd release
          sha256sum *-Android-Release.apk > SHA256SUMS-android.txt

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-android-release
          path: |
            release/*-Android-Release.apk
            release/SHA256SUMS-android.txt
          if-no-files-found: error
          retention-days: 30

  windows-release:
    name: Signed Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Decode Windows code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CSC_BASE64: ${{ secrets.WINDOWS_CSC_BASE64 }}
          WINDOWS_CSC_PASSWORD: ${{ secrets.WINDOWS_CSC_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_BASE64)) {
            throw 'Missing GitHub Secret: WINDOWS_CSC_BASE64'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_PASSWORD)) {
            throw 'Missing GitHub Secret: WINDOWS_CSC_PASSWORD'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'jame-windows-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CSC_BASE64)
          )
          "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$($env:WINDOWS_CSC_PASSWORD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and audit source
        run: |
          pnpm test
          pnpm run test:security
          pnpm run audit

      - name: Build signed Windows installer
        run: pnpm run package:windows

      - name: Verify signature and write SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter '*-Windows-Setup.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not produced.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows Authenticode signature is not valid: $($signature.Status)"
          }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName
          "$($hash.Hash.ToLowerInvariant()) *$($installer.Name)" |
            Set-Content -LiteralPath 'release/SHA256SUMS-windows.txt' -Encoding ascii

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-windows-release
          path: |
            release/*-Windows-Setup.exe
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - android-release
      - windows-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-android-release
          path: bundles/android

      - name: Download Windows artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-windows-release
          path: bundles/windows

      - name: Create release and upload verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "جامع التفاسیر منصور $RELEASE_TAG"
          fi
          while IFS= read -r -d '' file; do
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done < <(find bundles -type f -print0)
