org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
# The desktop build environment blocks Kotlin daemon loopback connections.
# In-process compilation is deterministic and avoids repeated daemon retries.
kotlin.compiler.execution.strategy=in-process
# Release signing values must never be persisted in Gradle's configuration cache.
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
